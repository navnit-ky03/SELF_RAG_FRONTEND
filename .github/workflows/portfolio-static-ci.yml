name: Portfolio static regression
on:
  push:
    branches: [feature/portfolio-v2.2]
  pull_request:
    branches: [feature/portfolio-v2, main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS syntax
        run: |
          node --check portfolio.js
          node --check scripts/build.mjs
      - name: Generate pages
        run: npm run build
      - name: Assert generated site is committed
        run: git diff --exit-code
      - name: Static and fullscreen regression
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test runtime
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run Chromium interaction regressions
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python tests/browser.py
